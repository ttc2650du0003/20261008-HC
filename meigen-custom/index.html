<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>名言集</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="wrapper">
    <h1>名言集</h1>
    <div class="left-box">
      <figure>
        <img src="images/fullmetal.jpg" alt="エド">
        <figcaption>エドワード・エルリック</figcaption>
      </figure>
      <p>
        「人は何かの犠牲なしに何も得ることはできない。何かを得るためには同等の代価が必要になる。」<br>
      「痛みを伴わない教訓には意義がない。人は何かの犠牲なしには何も得ることはできないのだから。しかし、その痛みに耐え、乗り越えた時・・・・人は何ものにも負けない、強靭な心を手に入れる。」
    </p>
    </div>

    <div class="right-box">
      <figure>
        <img src="images/attack.jpeg" alt="arumin">
        <figcaption>アルミン・アルレルト</figcaption>
      </figure>
      <p>
        「何かを変えることのできる人間がいるとすれば、その人はきっと…大事なものを捨てることができる人だ。」<br>
        「何も捨てることができない人には何も変えることはできないだろう。」
      </p>
    </div>

    <div class="center-box">
      <figure>
        <img src="images/nishiya.jpg" alt="nishiya">
        <figcaption>西谷　夕</figcaption>
      </figure>
      <p>
        「皆前だけ見てけよォ！！背中は俺が護ってやるぜ」
      </p>
    </div>
  </div>
</body>

</html>
